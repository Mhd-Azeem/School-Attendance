name: Android APK
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - name: Build original and demo APKs
        run: gradle testProductionDebugUnitTest testDemoDebugUnitTest assembleProductionDebug assembleDemoDebug
        working-directory: android

      - name: Prepare release APK
        run: |
          cp android/app/build/outputs/apk/production/debug/app-production-debug.apk School-Attendance-v0.1.1-alpha.apk
          cp android/app/build/outputs/apk/demo/debug/app-demo-debug.apk School-Attendance-Demo-v0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: school-attendance-original-apk
          path: School-Attendance-v0.1.1-alpha.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: school-attendance-demo-apk
          path: School-Attendance-Demo-v0.1.0.apk
          if-no-files-found: error
      - name: Publish original GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1-alpha
          name: School Attendance v0.1.1 Alpha
          prerelease: true
          generate_release_notes: true
          body: |
            Initial Android development build of the School Attendance Management System.

            This APK uses the shared Cloudflare Worker + D1 backend.
          files: School-Attendance-v0.1.1-alpha.apk
      - name: Publish no-sign-in Demo Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-demo
          name: School Attendance Demo v0.1.0
          prerelease: false
          generate_release_notes: false
          body: |
            No-sign-in interface demonstration of the School Attendance Management System.

            - Opens directly without an account
            - Works fully offline with fictional students
            - Includes the Section Head dashboard
            - Includes the Teacher attendance workflow
            - Demonstrates Present, Absent, Late, Mark All Present, totals,
              confirmation and local submission success

            This demo does not connect to the production backend and does not store real attendance.
          files: School-Attendance-Demo-v0.1.0.apk
