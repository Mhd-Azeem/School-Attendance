name: Original Android APK
on:
  push:
    paths: ['android/**', 'web/**', 'branding/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm', cache-dependency-path: web/package-lock.json }
      - name: Prepare Zahira College branding
        run: |
          mkdir -p web/public
          base64 -d branding/zahira-logo.jpg.b64 > web/public/zahira-logo.jpg
          mkdir -p android/app/src/main/res/drawable
          base64 -d branding/zahira-logo.jpg.b64 > android/app/src/main/res/drawable/zahira_logo.jpg
      - name: Build complete web app for Original APK
        working-directory: web
        env:
          VITE_API_URL: https://school-attendance-api.azeemzahira111.workers.dev
        run: |
          npm ci
          npm test
          npm run build
      - name: Bundle web app into Original APK
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -R web/dist/. android/app/src/main/assets/web/
      - name: Build Original APK
        run: gradle assembleDebug
        working-directory: android
      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName="\K[^"]+' android/app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=School-Attendance-INSTALL.apk" >> "$GITHUB_OUTPUT"
      - name: Prepare Original APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "${{ steps.app_version.outputs.apk }}"
      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ steps.app_version.outputs.version }}-build-${{ github.run_number }}
          name: School Attendance v${{ steps.app_version.outputs.version }} · Build ${{ github.run_number }} — ONE APK
          prerelease: false
          generate_release_notes: true
          body: |
            This release publishes exactly ONE Android APK asset: School-Attendance-INSTALL.apk.
            GitHub automatically adds Source code (zip) and Source code (tar.gz); those are not Android app files.
            Every successful APK build is published to the GitHub Releases tab.
          files: ${{ steps.app_version.outputs.apk }}
