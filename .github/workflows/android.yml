name: Original Android APK
on:
  push:
    paths: ['android/**', 'web/**', 'branding/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm', cache-dependency-path: web/package-lock.json }

      - name: Prepare Zahira College branding
        run: |
          mkdir -p web/public
          base64 -d branding/zahira-logo.jpg.b64 > web/public/zahira-logo.jpg
          mkdir -p android/app/src/main/res/drawable
          base64 -d branding/zahira-logo.jpg.b64 > android/app/src/main/res/drawable/zahira_logo.jpg

      - name: Build complete web app for Original APK
        working-directory: web
        env:
          VITE_API_URL: https://school-attendance-api.azeemzahira111.workers.dev
        run: |
          npm ci
          npm test
          npm run build

      - name: Bundle web app into Original APK
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -R web/dist/. android/app/src/main/assets/web/

      - name: Validate signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD_PRIMARY: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PASSWORD_ALT: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD_PRIMARY: ${{ secrets.KEY_PASSWORD }}
          KEY_PASSWORD_ALT: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64" && exit 1)
          if [ -z "$KEYSTORE_PASSWORD_PRIMARY" ] && [ -z "$KEYSTORE_PASSWORD_ALT" ]; then
            echo "Missing keystore password secret: set KEYSTORE_PASSWORD or ANDROID_KEYSTORE_PASSWORD"
            exit 1
          fi
          if [ -z "$KEY_PASSWORD_PRIMARY" ] && [ -z "$KEY_PASSWORD_ALT" ]; then
            echo "Missing key password secret: set KEY_PASSWORD or ANDROID_KEY_PASSWORD"
            exit 1
          fi

      - name: Restore and validate permanent release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD }}
        run: |
          RAW_B64="$ANDROID_KEYSTORE_BASE64"

          # Accept either the raw Base64 payload or a copied
          # ANDROID_KEYSTORE_BASE64=<payload> line from the backup file.
          if printf '%s' "$RAW_B64" | grep -q 'ANDROID_KEYSTORE_BASE64='; then
            RAW_B64=$(printf '%s\n' "$RAW_B64" | sed -n 's/^ANDROID_KEYSTORE_BASE64=//p' | head -n 1)
          fi

          CLEAN_B64=$(printf '%s' "$RAW_B64" | tr -d '\r\n\t ' | tr -d '"')
          if ! printf '%s' "$CLEAN_B64" | base64 --decode > android/release-keystore.jks; then
            echo "ANDROID_KEYSTORE_BASE64 is not valid Base64."
            echo "Paste only the contents of keystore_base64.txt, or the full ANDROID_KEYSTORE_BASE64=<payload> line."
            exit 1
          fi

          ACTUAL_SIZE=$(wc -c < android/release-keystore.jks | tr -d ' ')
          if [ "$ACTUAL_SIZE" != "3998" ]; then
            echo "Decoded keystore has the wrong size: $ACTUAL_SIZE bytes (expected 3998)."
            exit 1
          fi

          ACTUAL_SHA=$(sha256sum android/release-keystore.jks | awk '{print $1}')
          EXPECTED_SHA="fb229946f25169255bcc252a3e5993f7cb659bdc146f0abed247b0d1b4732cc2"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "Decoded keystore does not match the permanent School Attendance keystore."
            exit 1
          fi

          clean_value() {
            local value="$1"
            value="${value#ANDROID_KEYSTORE_PASSWORD=}"
            value="${value#KEYSTORE_PASSWORD=}"
            value="${value#ANDROID_KEY_PASSWORD=}"
            value="${value#KEY_PASSWORD=}"
            value="${value%\"}"
            value="${value#\"}"
            printf '%s' "$value"
          }

          EXPECTED_STORE_HASH="acc340abc1bb91efc1fe0fab3d3b3dd0ccaf2bbb2b62ca0abdd4bdc8961cd791"
          STORE_PASS=""
          for candidate in "$KEYSTORE_PASSWORD_PRIMARY" "$KEYSTORE_PASSWORD_ALT"; do
            candidate=$(clean_value "$candidate")
            [ -n "$candidate" ] || continue
            candidate_hash=$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')
            if [ "$candidate_hash" = "$EXPECTED_STORE_HASH" ]; then
              STORE_PASS="$candidate"
              break
            fi
          done
          if [ -z "$STORE_PASS" ]; then
            echo "Neither KEYSTORE_PASSWORD nor ANDROID_KEYSTORE_PASSWORD matches the permanent keystore."
            exit 1
          fi

          if ! keytool -list -keystore android/release-keystore.jks -storepass "$STORE_PASS" >/dev/null 2>&1; then
            echo "Matched keystore password fingerprint, but keytool rejected the keystore."
            exit 1
          fi

          EXPECTED_KEY_HASH="4c201580789610a2fa5c1e41114a0abc586faec95b4dc0fcc0a1ab2c80ad6f6c"
          KEY_PASS=""
          for candidate in "$KEY_PASSWORD_PRIMARY" "$KEY_PASSWORD_ALT"; do
            candidate=$(clean_value "$candidate")
            [ -n "$candidate" ] || continue
            candidate_hash=$(printf '%s' "$candidate" | sha256sum | awk '{print $1}')
            if [ "$candidate_hash" = "$EXPECTED_KEY_HASH" ]; then
              KEY_PASS="$candidate"
              break
            fi
          done
          if [ -z "$KEY_PASS" ]; then
            echo "Neither KEY_PASSWORD nor ANDROID_KEY_PASSWORD matches the permanent signing key."
            exit 1
          fi

          echo "ANDROID_KEYSTORE_PASSWORD_CLEAN=$STORE_PASS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD_CLEAN=$KEY_PASS" >> "$GITHUB_ENV"
          echo "Permanent keystore and signing passwords verified successfully."

      - name: Build permanently signed Original APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: release-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ env.ANDROID_KEYSTORE_PASSWORD_CLEAN }}
          ANDROID_KEY_ALIAS: school-attendance-release
          ANDROID_KEY_PASSWORD: ${{ env.ANDROID_KEY_PASSWORD_CLEAN }}
        run: gradle assembleRelease

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName="\K[^"]+' android/app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode=\K[0-9]+' android/app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "apk=School-Attendance-INSTALL.apk" >> "$GITHUB_OUTPUT"

      - name: Prepare Original APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "${{ steps.app_version.outputs.apk }}"

      - name: Verify APK signing certificate
        run: |
          keytool -printcert -jarfile "${{ steps.app_version.outputs.apk }}"
          jarsigner -verify -verbose -certs "${{ steps.app_version.outputs.apk }}" >/dev/null

      - name: Publish APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ steps.app_version.outputs.version }}-build-${{ github.run_number }}
          name: School Attendance v${{ steps.app_version.outputs.version }} · Build ${{ github.run_number }} — PERMANENTLY SIGNED
          prerelease: false
          generate_release_notes: true
          body: |
            Production APK signed with the permanent School Attendance release keystore.
            Build number: ${{ steps.app_version.outputs.version_code }}
            Package: com.azeem.schoolattendance
            Future releases must use the same GitHub signing secrets so Android can update in place.
            This release publishes exactly one Android APK asset: School-Attendance-INSTALL.apk.
          files: ${{ steps.app_version.outputs.apk }}
