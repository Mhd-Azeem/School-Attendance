name: Android APK
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - run: gradle testDebugUnitTest assembleDebug
        working-directory: android
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - name: Prepare release APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk School-Attendance-v0.1.0-alpha.apk
      - uses: actions/upload-artifact@v4
        with: { name: school-attendance-debug-apk, path: School-Attendance-v0.1.0-alpha.apk, if-no-files-found: error }
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-alpha
          name: School Attendance v0.1.0 Alpha
          prerelease: true
          generate_release_notes: true
          body: |
            Initial Android development build of the School Attendance Management System.

            This APK uses the shared Supabase backend. Configure the repository variables
            `SUPABASE_URL` and `SUPABASE_ANON_KEY`, then rerun this workflow before real use.
          files: School-Attendance-v0.1.0-alpha.apk
