name: Original Android APK
on:
  push:
    paths: ['release-trigger/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm', cache-dependency-path: web/package-lock.json }
      - name: Prepare Zahira College branding
        run: |
          mkdir -p web/public
          base64 -d branding/zahira-logo.jpg.b64 > web/public/zahira-logo.jpg
          mkdir -p android/app/src/main/res/drawable
          base64 -d branding/zahira-logo.jpg.b64 > android/app/src/main/res/drawable/zahira_logo.jpg
      - name: Build complete web app for Original APK
        working-directory: web
        env:
          VITE_API_URL: https://school-attendance-api.azeemzahira111.workers.dev
        run: |
          npm ci
          npm test
          npm run build
      - name: Bundle web app into Original APK
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -R web/dist/. android/app/src/main/assets/web/
      - name: Build Original APK
        run: gradle assembleDebug
        working-directory: android
      - name: Prepare Original APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk School-Attendance-Original-v0.2.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: School-Attendance-Original-v0.2.0
          path: School-Attendance-Original-v0.2.0.apk
          if-no-files-found: error
      - name: Publish Original GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0-original
          name: School Attendance Original v0.2.0
          prerelease: false
          generate_release_notes: true
          body: |
            Major green UI redesign matching the approved mobile mockup.
            Includes Teacher and Section Head dashboards, student attendance, teacher-period attendance, profile, management, timetable setup and shared Cloudflare Worker + D1 connectivity.
          files: School-Attendance-Original-v0.2.0.apk
