name: Original Android APK
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-original:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.13' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: 'npm', cache-dependency-path: web/package-lock.json }
      - name: Build complete web app for Original APK
        working-directory: web
        env:
          VITE_API_URL: https://school-attendance-api.azeemzahira111.workers.dev
        run: |
          npm ci
          npm test
          npm run build
      - name: Bundle web app into Original APK
        run: |
          rm -rf android/app/src/main/assets/web
          mkdir -p android/app/src/main/assets/web
          cp -R web/dist/. android/app/src/main/assets/web/
      - name: Build Original APK
        run: gradle testProductionDebugUnitTest assembleProductionDebug
        working-directory: android
      - name: Prepare Original APK
        run: cp android/app/build/outputs/apk/production/debug/app-production-debug.apk School-Attendance-Original-v0.1.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: School-Attendance-Original-v0.1.1
          path: School-Attendance-Original-v0.1.1.apk
          if-no-files-found: error
      - name: Publish Original GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.1-original
          name: School Attendance Original v0.1.1
          prerelease: true
          generate_release_notes: true
          body: |
            Original production Android app for the School Attendance Management System.
            Connected to the shared Cloudflare Worker + D1 backend.
          files: School-Attendance-Original-v0.1.1.apk
