name: Prune old releases

on:
  push:
    paths:
      - ".github/workflows/prune-old-releases.yml"

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Keep newest three releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/release_ids.txt
          page=1
          while true; do
            data="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=${page}")"
            count="$(jq 'length' <<< "$data")"
            if [ "$count" -eq 0 ]; then
              break
            fi
            jq -r '.[].id' <<< "$data" >> /tmp/release_ids.txt
            if [ "$count" -lt 100 ]; then
              break
            fi
            page=$((page + 1))
          done

          total="$(wc -l < /tmp/release_ids.txt | tr -d ' ')"
          delete_count=$(( total > 3 ? total - 3 : 0 ))
          echo "Found $total release(s). Deleting $delete_count old release(s); keeping the newest three."

          tail -n +4 /tmp/release_ids.txt | while read -r id; do
            [ -z "$id" ] && continue
            echo "Deleting release id $id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
          done
