name: Prune old releases

on:
  push:
    paths:
      - ".github/workflows/prune-old-releases.yml"

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Keep newest three releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t RELEASE_IDS < <(
            gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100"               --jq 'add | .[3:] | .[].id'
          )
          echo "Deleting ${#RELEASE_IDS[@]} old release(s); keeping the newest three."
          for id in "${RELEASE_IDS[@]}"; do
            echo "Deleting release id $id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/$id"
          done
